services:
  - type: web
    name: kaaran-backend
    env: python
    buildCommand: pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r python/requirements.txt
    startCommand: uvicorn python.api:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
